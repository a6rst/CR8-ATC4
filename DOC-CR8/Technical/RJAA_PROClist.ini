INANBA TRANSITION (PAPA) =
Từ INT Papa, bay theo CVC R179 đi đến INT Uncle, rồi theo MJE R067 về đến INT Niece đạt FL160 hoặc cao hơn, rồi về đến INT Tango, rồi theo CVC R203 đi đến INT Inanba hoặc INT Smith. Tiếp tục theo huấn lệnh của KSVKL.
	From Papa INT, follow CVC R179 outbound to Uncle INT, then follow MJE R067 inbound to Niece INT at or above FL160, then to Tango INT, then follow CVC R203 outbound to Inanba INT or Smith INT. Continue as cleared by ATC.

INANBA ARC TRANSITION (PAPA) =
