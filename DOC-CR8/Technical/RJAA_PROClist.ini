CHOSHI 1 DEPARTURE (RWY16) =
Bay lên trên YQ 156° đi đến NRE D12.0, tiến nhập HME R093 đi đến HME D48.3 (OJC R046/D31.1), rồi theo OJC R046 đi đến OJC D43.3 (CVC R092/D7.0) để nhập đường bay OTR-11, hoặc tiếp tục theo HME R093 đi đến HME D72.9 (CVC R115/D24.0) để nhập đường bay OTR-13-15.
	Climb on YQ 156° to NRE D12.0, intercept HME R093 outbound to HME D48.3 (OJC R046/D31.1), then follow OJC R046 outbound to OJC D43.3 (CVC R092/D7.0) to enter OTR-11, or continue on HME R093 outbound to HME D72.9 (CVC R115/D24.0) to enter OTR-13-15.

JUPITER DEPARTURE (RWY16) =
Bay lên trên YQ 156° đi đến NRE D12.0, tiến nhập NRE R156 đi đến INT Jupiter.
	Climb on YQ 156° to NRE D12.0, intercept NRE R156 outbound to Jupiter INT.

MAMA 1 DEPARTURE (RWY16) =
Bay lên trên YQ 156° đi đến NRE D12.0, vòng phải tiến nhập NRE R171 đi đến INT Mama.
	Climb on YQ 156° to NRE D12.0, turn right to intercept NRE R171 outbound to Mama INT.

PAPA 1 DEPARTURE (RWY16) =
Bay lên trên YQ 156° đi đến NRE D12.0, vòng trái tiến nhập NRE R140 đi đến INT Papa.
	Climb on YQ 156° to NRE D12.0, turn left to intercept NRE R140 outbound to Papa INT.

SAKURA 1 DEPARTURE (RWY16) =
Bay lên trên YQ 156° đi đến NRE D12.0, vòng phải tiến nhập TYE R160 về đến đài VOR/DME Sakura (TYE).
	Climb on YQ 156° to NRE D12.0, turn right to intercept TYE R160 inbound to Sakura VOR/DME (TYE).

NARITA 1 REVERSAL DEPARTURE (RWY16) =
Bay lên trên YQ 156° đi đến NRE D12.0, vòng trái tiến nhập NRE R130 về đến đài VOR/DME Narita (NRE). Qua đài VOR/DME Narita (NRE) đạt 6000ft hoặc cao hơn cho YAMIZO, IWAKI, NIKKO TRANSITION, đạt FL150 hoặc cao hơn cho NASU TRANSITION, đạt FL140 hoặc cao hơn cho HANEDA, KISARAZU TRANSITION. Dốc tăng cao tối thiểu 540ft/NMI khi ấn định FL140 trở lên.
	Climb on YQ 156° to NRE D12.0, turn left to intercept NRE R130 inbound to Narita VOR/DME (NRE). Cross Narita VOR/DME (NRE) at or above 6000ft for YAMIZO, IWAKI, NIKKO TRANSITION, at or above FL150 for NASU TRANSITION, at or above FL140 for HANEDA, KISARAZU TRANSITION. Minimum climb gradient of 540ft/NMI required when assigned FL140 or higher.

CHOSHI 2 DEPARTURE (RWY34) =
Bay lên trên KF 336° đi đến NRE D7.0, vòng phải tiến nhập SNE R099, qua NRE R345 đạt 2800ft hoặc cao hơn, qua NRE R002 đạt 7000ft hoặc thấp hơn, qua NRE R031 (SNE D23.4) đạt 3500ft hoặc cao hơn, đi đến SNE D28.1 đạt 4500ft hoặc cao hơn, rồi theo CVC R319 về đài VORTAC Choshi (CVC).
	Climb on KF 336° to NRE D7.0, turn right to intercept SNE R099 outbound, cross NRE R345 at or above 2800ft, cross NRE R002 at or below 7000ft, cross NRE R031 (SNE D23.4) at or above 3500ft, to SNE D28.1 at or above 4500ft, then follow CVC R319 inbound to Choshi VORTAC (CVC).

MAMA 2 DEPARTURE (RWY34) =
