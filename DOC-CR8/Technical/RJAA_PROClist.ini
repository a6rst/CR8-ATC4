NARITA REVERSAL 2 DEPARTURE (RWY34) =
Bay lên trên KF 336° đi đến NRE D7.0, vòng phải tiến nhập SNE R099 đi, qua NRE R345 đạt 2800ft hoặc cao hơn, qua NRE R360 (TYE R034) đạt 7000ft hoặc thấp hơn, đi đến SNE D23.4 (NRE R031/D10.0) đạt 3500ft hoặc cao hơn, rồi vòng phải trên hướng mũi 160°, rồi tiến nhập NRE R080 về đài VOR/DME Narita (NRE). Qua đài VOR/DME Narita (NRE) đạt FL150 hoặc cao hơn cho NASU TRANSITION, đạt FL140 hoặc cao hơn cho HANEDA, KISARAZU TRANSITION.
